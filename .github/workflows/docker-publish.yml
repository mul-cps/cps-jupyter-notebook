name: Build & Publish ML Variants

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    tags:
      - "v*.*.*"
    paths:
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'
  # NOTE: PR builds don't push (see `push:` conditions below), so dependent
  # jobs (build-gpu-frameworks/build-dependents) build against the already
  # published base images, not this PR's own base changes -- a build-only
  # smoke gate, not a fully hermetic build.
  pull_request:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '.github/workflows/docker-publish.yml'

env:
  IMAGE_NAME: cps-jupyter-notebook

jobs:
  build-bases:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        base: [base-cpu, base-gpu]
    steps:
      - uses: actions/checkout@v7
      - name: Free up disk space on runner
        run: |
          echo "Initial disk usage:"; df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghtl || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          docker system prune -af || true
          docker builder prune -af || true
          echo "Disk usage after cleanup:"; df -h
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Use in-cluster BuildKit pool
        run: |
          docker buildx create --name ci-pool --driver remote \
            tcp://buildkit-pool.ci.svc.cluster.local:1234 --use
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-${{ matrix.base }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile.${{ matrix.base }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            "admin_password=${{ secrets.CPS_JUPYTER_ADMIN_PASSWORD }}"
            "root_password=${{ secrets.CPS_JUPYTER_ROOT_PASSWORD }}"
          cache-from: type=gha,scope=${{ matrix.base }}
          cache-to: type=gha,mode=max,scope=${{ matrix.base }}

  build-pytorch-runtime:
    needs: build-bases
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        variant: [pytorch-runtime-base]
    steps:
      - uses: actions/checkout@v7
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghtl || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          docker system prune -af || true
          docker builder prune -af || true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Use in-cluster BuildKit pool
        run: |
          docker buildx create --name ci-pool --driver remote \
            tcp://buildkit-pool.ci.svc.cluster.local:1234 --use
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.variant }},enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=ref,event=tag,suffix=-${{ matrix.variant }}
            type=sha,suffix=-${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Determine BASE_IMAGE build-arg
        id: base_image_arg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-base-gpu:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile.${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.base_image_arg.outputs.value }}
          secrets: |
            "admin_password=${{ secrets.CPS_JUPYTER_ADMIN_PASSWORD }}"
            "root_password=${{ secrets.CPS_JUPYTER_ROOT_PASSWORD }}"
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Dockerfile | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.variant }} | docker/Dockerfile.${{ matrix.variant }} | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY

  build-gpu-frameworks:
    needs: build-pytorch-runtime
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pytorch-code
            base_image: cps-jupyter-notebook-base-gpu:${{ github.ref_name }}
          - variant: tf-code
            base_image: cps-jupyter-notebook-base-gpu:${{ github.ref_name }}
          - variant: desktop-xpra-base
            base_image: cps-jupyter-notebook:${{ github.ref_name }}-pytorch-runtime-base
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Use in-cluster BuildKit pool
        run: |
          docker buildx create --name ci-pool --driver remote \
            tcp://buildkit-pool.ci.svc.cluster.local:1234 --use
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.variant }},enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=sha,suffix=-${{ matrix.variant }}
      - id: base_image_arg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then echo "value=" >> "$GITHUB_OUTPUT"; else echo "value=BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.base_image }}" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile.${{ matrix.variant }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: ${{ steps.base_image_arg.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  build-dependents:
    needs: build-gpu-frameworks
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard-cpu
            dockerfile: docker/Dockerfile
            suffix: standard-cpu
            base_image: cps-jupyter-notebook-base-cpu:${{ github.ref_name }}
          - name: desktop-ros2
            dockerfile: docker/Dockerfile.desktop-ros2
            suffix: desktop-ros2
            base_image: cps-jupyter-notebook:${{ github.ref_name }}-pytorch-code
          - name: comfyui
            dockerfile: docker/Dockerfile.comfyui
            suffix: comfyui
            base_image: cps-jupyter-notebook:${{ github.ref_name }}-pytorch-code
          - name: desktop-ros2-xpra
            dockerfile: docker/Dockerfile.desktop-ros2-xpra
            suffix: desktop-ros2-xpra
            base_image: cps-jupyter-notebook:${{ github.ref_name }}-desktop-xpra-base
          - name: mujoco-xpra
            dockerfile: docker/Dockerfile.mujoco-xpra
            suffix: mujoco-xpra
            base_image: cps-jupyter-notebook:${{ github.ref_name }}-desktop-xpra-base
    steps:
      - uses: actions/checkout@v7
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghtl || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          docker system prune -af || true
          docker builder prune -af || true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Use in-cluster BuildKit pool
        run: |
          docker buildx create --name ci-pool --driver remote \
            tcp://buildkit-pool.ci.svc.cluster.local:1234 --use
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.suffix }},enable=${{ startsWith(github.ref, 'refs/heads/main') }}
            type=ref,event=branch,suffix=-${{ matrix.suffix }}
            type=ref,event=tag,suffix=-${{ matrix.suffix }}
            type=sha,suffix=-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Determine BASE_IMAGE build-arg
        id: base_image_arg
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=" >> "$GITHUB_OUTPUT"
          else
            echo "value=BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.base_image }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ steps.base_image_arg.outputs.value }}
          secrets: |
            "admin_password=${{ secrets.CPS_JUPYTER_ADMIN_PASSWORD }}"
            "root_password=${{ secrets.CPS_JUPYTER_ROOT_PASSWORD }}"
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
      - name: Generate Job Summary
        if: always()
        run: |
          echo "### Build Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | Dockerfile | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| ${{ matrix.name }} | ${{ matrix.dockerfile }} | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
